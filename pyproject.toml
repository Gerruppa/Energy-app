[project]
name = "pv-app"
version = "0.1.0"
description = "Lokalny dashboard kosztów i zużycia energii z faktur Tauron"
requires-python = ">=3.13"
dependencies = [
    "pdfplumber>=0.11.11",
    "plotly>=7.1.0",
    "streamlit>=1.40",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pv_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not real_pdfs'"
markers = [
    "real_pdfs: czyta prawdziwe Faktury z References/ (ok. 30 s); uruchom: uv run pytest -m real_pdfs",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["plotly", "plotly.*"]
ignore_missing_imports = true
